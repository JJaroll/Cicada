[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicada"
description = "Herramienta local de organización musical y sincronización automática de metadatos de alta fidelidad."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JJaroll" }]
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/JJaroll/Cicada"

[project.scripts]
cicada = "cicada.__main__:main"

[project.optional-dependencies]
ipod = ["zstandard==0.25.0", "wasmtime", "numpy"]

[tool.setuptools.dynamic]
version = { attr = "cicada.core.main.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["cicada*"]
